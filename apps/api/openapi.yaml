  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/sales:
    get:
      operationId: getStationSalesHistory
      summary: Search a station's completed sales and reprint receipts
      description: >-
        Requires station POS view permission. Search is limited to sales visible
        under forced row-level security and matches receipt number, customer,
        item name/SKU/barcode, or payment label. Results are newest first and
        limited to 100 rows per page.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 50000, default: 0 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Station-scoped completed sale summaries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationSalesHistoryEnvelope' }
        '400':
          description: Search or pagination input is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Account lacks station POS view permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Station history is temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    post:
      operationId: commitHostedSale
      summary: Commit an atomic, server-priced hosted sale
      description: >-
        Requires sales:checkout, the current cashier lease, a single-use
        checkout challenge for the exact serialized body, and an Ed25519 proof
        from the active station key. The API reads current branch prices and
        tax rates, locks stock, validates enabled configured manual tenders,
        snapshots the receipt and commits sale, stock, movement, tender,
        proof consumption and audit records in one transaction. An optional on-account portion requires an active customer credit term and available exposure; the immutable receivable invoice and accounts-receivable journal entry are committed with the sale. Cash requires
        the current station drawer shift and is included in its reconciliation. If a register cash location is configured, it must have a manager-recorded physical cutover count; cash tenders then append linked positive register events without changing X/Z drawer movement inputs.
        External
        tender recording is cashier-confirmed; it does not mean the provider
        authorized or captured funds. Matching retries return the saved receipt.
        An on-account amount must be covered by the customer's current branch-currency credit exposure and creates a due-dated immutable invoice in the same transaction. A ready pickup can be collected only by including its ID and expected
        revision in the signed request and every held line at its full quantity;
        hold consumption, sale, stock movements and the collection event commit
        together.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
        - name: X-Station-Lease-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Station-Lease-Token
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - name: X-Station-Challenge-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Station-Proof
          in: header
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{128}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedSaleRequest'
      responses:
        '200':
          description: Sale committed or exact prior receipt returned for an idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostedSaleEnvelope'
        '400':
          description: Invalid sale lines, tender amounts, or request schema.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: The station proof is invalid, expired, or bound to another body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: The active account has no checkout permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Product or branch resource is unavailable in this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Lease, stock, tender, credit limit, pickup hold, cash drawer prerequisite, or idempotency conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Sale persistence is temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
