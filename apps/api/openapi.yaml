          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stock-transfers/{transfer_id}/events:
    post:
      operationId: transitionStockTransfer
      summary: Transition an inter-branch stock transfer
      description: >-
        Requires branch-scoped inventory:transfer:manage. The source branch accepts
        or rejects a request; acceptance atomically allocates available stock.
        Dispatch debits source stock and releases that transfer's allocation while
        preserving other commitments. A partial dispatch requires a reason and
        releases its unshipped balance. Destination receipt quantities are
        incremental per delivery and stock increases only by the new physical
        quantity. A receipt without a note remains open when more goods are
        expected; a short shipment can be closed with a note and later resolved
        with a separate audited action. Each state transition, stock update,
        movement, audit record and append-only event is committed atomically.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transfer_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockTransferTransitionRequest' }
      responses:
        '200':
          description: Updated transfer or exact idempotent replay.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransferEnvelope' }
        '400':
          description: The action, revision, quantities or required note is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: The caller lacks branch-scoped transfer management permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: The transfer is not visible at this branch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Revision/state changed, request key conflicts, or source availability cannot cover this transfer and other commitments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/pickup-reservations:
    get:
      operationId: listStationPickupReservations
      summary: List holds visible at a cashier station
      description: Requires station-scoped inventory:pickup:read. Origin cashiers see holds created at their exact station; pickup-branch staff see holds awaiting pickup there.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Up to 100 reservations visible at this branch and station.
          content: { application/json: { schema: { $ref: '#/components/schemas/PickupReservationsEnvelope' } } }
        '403':
          description: The caller lacks station-scoped pickup read permission.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      operationId: createPickupReservation
      summary: Reserve products for customer pickup at another branch
      description: >-
        Requires station-scoped inventory:pickup:request. The server locks all
        branch/product inventory keys in stable order, verifies current available
        stock, then creates the multi-item hold and quantity-only allocation in
        one transaction. A hold lasts 60 minutes by default; staff may request
        15 minutes through 24 hours. The response is the only confirmation that
        inventory is reserved. Contact snapshots are readable only to the origin
        station and staff at either participating branch, and never appear in
        availability data. Collection is completed only by a normal sale at the
        pickup branch; this API does not collect or charge a customer.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PickupReservationRequest' } } }
      responses:
        '200':
          description: The created reservation or exact request replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/PickupReservationEnvelope' } } }
        '400':
          description: Invalid products, contact consent, idempotency key or hold duration.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: The caller lacks station-scoped pickup request permission.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: The hold key conflicts or the pickup branch no longer has sufficient available stock.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/pickup-reservations/{reservation_id}/events:
    post:
      operationId: transitionStationPickupReservation
      summary: Prepare an incoming pickup or cancel the cashier's own outgoing hold
      description: >-
        Ready requires station-scoped inventory:pickup:prepare at the pickup
        branch. Cancel requires inventory:pickup:request and is limited to the
        originating cashier station unless the caller is an assigned manager.
        Cancellation releases the stock allocation in the same transaction.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reservation_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PickupReservationTransitionRequest' } } }
      responses:
        '200':
          description: The transitioned reservation or exact request replay.
          content: { application/json: { schema: { $ref: '#/components/schemas/PickupReservationEnvelope' } } }
        '403':
          description: The caller lacks action permission or the transition is not allowed for their role and branch/station scope.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: The reservation is not visible at this branch or station.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: The revision is stale, state is no longer transitionable, or the idempotency key conflicts.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/stock-transfers:
    get:
      operationId: listStationStockTransfers
      summary: List the latest stock transfers visible at a register
      description: Requires station-scoped inventory:transfer:read. Cashiers see only their own requests; managers can review the branch queue.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Transfers where this branch is the source or destination.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransfersEnvelope' }
        '403':
          description: The caller lacks station-scoped inventory:transfer:read permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    post:
      operationId: requestStockTransfer
      summary: Request stock from another active branch
      description: >-
        Requires station-scoped inventory:transfer:request. The destination branch
        creates an idempotent request for products assigned to both branches.
        This records no reservation and changes neither branch's stock; source
        approval, dispatch and destination receipt are separate operations.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          description: Reuse this key with the exact same body after a timeout.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockTransferRequest' }
      responses:
        '200':
          description: Request created or exact idempotent replay returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockTransferEnvelope' }
        '400':
          description: Idempotency key or request data is invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: The caller lacks station-scoped inventory:transfer:request permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: The source branch or one of the products is unavailable to this business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The idempotency key conflicts with an earlier request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/products/{product_id}/availability:
    get:
      operationId: getProductAvailabilityAcrossBranches
      summary: Check a register product's stock at every active branch in the business
      description: >-
        Requires station-scoped inventory:availability:read permission. Cashiers
        can see branch name, price, currency and stock quantity for this product;
        costs and unrelated tenant data are not returned. Each row carries the
        server time when the live stock snapshot was read. This response does
        not reserve inventory or move stock between branches.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active branch rows for the product, including zero-stock branches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductAvailabilityEnvelope'
        '403':
          description: The caller lacks station-scoped inventory:availability:read permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The product is not active in the source register's catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/products/{product_id}/stock-adjustments:
    post:
      operationId: adjustBranchProductStock
      summary: Record an authorized stock count or correction
      description: >-
        Requires branch-scoped inventory:write permission. The branch balance,
        immutable stock movement and audit event commit together. An exact
        retry with the same Idempotency-Key returns the original movement result.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: product_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key for this adjustment attempt; retain it when retrying after a timeout.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentRequest'
      responses:
        '201':
          description: Stock changed and movement recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustmentEnvelope'
        '200':
          description: The same adjustment key and payload were already committed; original result returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustmentEnvelope'
        '400':
          description: Invalid idempotency key, zero delta, or invalid note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks branch-scoped inventory:write permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Product is not assigned to this branch or is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The adjustment would produce negative stock, or the key was reused with another payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/payment-options:
    get:
      operationId: listBranchPaymentOptions
      summary: List payment methods configured for a branch
      description: Requires branch-scoped payments:read permission. Provider details are labels only; all options are recorded manually until an integration is configured.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Branch payment options.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOptionsEnvelope' }
        '403':
          description: The caller lacks branch-scoped payments:read permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    post:
      operationId: createBranchPaymentOption
      summary: Add a manually recorded payment method for a branch
      description: Requires branch-scoped payments:write permission. This records an intended tender method, not provider authorization or payment capture.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPaymentOption' }
      responses:
        '201':
          description: Payment method created and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOptionEnvelope' }
        '400':
          description: Invalid method data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: The caller lacks branch-scoped payments:write permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The idempotency key was reused with a different payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The method key or branch label already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/payment-options:
    get:
      operationId: listStationPaymentOptions
      summary: List payment methods visible at an assigned station
      description: Requires station-scoped payments:read permission. Provider details are labels only; all options are recorded manually until an integration is configured.
      security:
