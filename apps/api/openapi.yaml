              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/payment-options/{option_id}:
    patch:
      operationId: updateBranchPaymentOption
      summary: Edit or disable a branch payment method
      description: Requires branch-scoped payments:write permission. Expected revision prevents overwriting another manager's changes. Payment methods are retained for historical tender references and cannot be deleted.
      security:
