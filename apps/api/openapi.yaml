openapi: 3.1.0
info:
  title: Advanced POS API
  version: 1.0.0
  description: >-
    Hosted POS API with verified identity, tenant and station authorization,
    signed station leases, checkout, drawer reconciliation, purchasing and
    supplier settlement workflows. Hosted tenders are recorded manually;
    payment processor capture and verification are not implemented.
servers:
  - url: http://127.0.0.1:8787
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process liveness
      responses:
        '200':
          description: Process is accepting requests.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    const: ok
  /v1/sale-calculations:
    post:
      operationId: calculateSalePreview
      summary: Calculate a non-authoritative sale preview
      description: >-
        Uses only caller-supplied values. Does not read tenant data, validate
        merchant settings, persist a sale, or authorize checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCalculationRequest'
      responses:
        '200':
          description: Calculated totals and stable line allocations.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SaleCalculationResponse'
        '400':
          description: Invalid JSON schema, line count or calculation input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Request body exceeds the configured limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Request is not JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/auth/identity:
    get:
      operationId: getVerifiedIdentity
      summary: Verify a bearer token and resolve its internal account
      description: >-
        Requires server-side ZITADEL introspection and runtime PostgreSQL
        configuration. The verified issuer and subject are matched exactly to a
        provisioned person identity. No email linking or auto-provisioning occurs.
        The response contains only internal identity ID and status; it does not
        resolve tenant membership, roles, branch access, or station permissions.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified token mapped to an active internal identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalIdentityEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The mapped internal identity is suspended or removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No internal identity is provisioned for the verified issuer and subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity provider or runtime database is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/me/tenants:
    get:
      operationId: listMyTenantAccess
      summary: List the signed-in identity's active tenant and location access
      description: >-
        Requires a verified bearer token and active provisioned identity. The
        API derives identity context from the verified provider issuer and subject,
        then applies transaction-local PostgreSQL row-level security. No identity
        or tenant authority is accepted from the client. Role keys and scopes are
        context only; the station permission snapshot endpoint evaluates the
        server-owned baseline permissions for the requested station.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active tenant memberships and granted branch/station scopes. An identity with no memberships receives an empty data array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMembershipsEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The mapped internal identity is suspended or removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: No internal identity is provisioned for the verified issuer and subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity provider or tenant database is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/staff:
    get:
      operationId: listTenantStaff
      summary: List active staff profiles in a tenant
      description: Requires tenant-wide users:write permission (owner or administrator). Identity-provider subjects and contact details are not returned.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Active staff membership IDs, display names and role labels.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedStaffEnvelope' } } }
        '401':
          description: Missing or invalid access token.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Tenant-wide users:write permission is required.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503':
          description: Staff directory storage is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/customers/{customer_id}/credit-terms:
    get:
      operationId: listTenantCustomerCreditTerms
      summary: List audited credit terms for one active customer
      description: Requires tenant-wide customers:manage. Terms apply across branches for each currency and revisions are append-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: customer_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Customer credit terms, one record per configured currency.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCustomerCreditTermsEnvelope' } } }
        '403':
          description: Tenant-wide customers:manage permission is required.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Active customer not found in the tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/customers/{customer_id}/credit-terms/{currency_code}/history:
    get:
      operationId: listTenantCustomerCreditTermHistory
      summary: List immutable changes to a customer's credit terms
      description: Requires tenant-wide customers:manage. Returns at most 100 revisions for one currency, newest first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: customer_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: currency_code, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z]{3}$' } }
      responses:
        '200':
          description: Credit term revisions, including the actor and reason for each change.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCustomerCreditTermHistoryEnvelope' } } }
        '400':
          description: Invalid customer identifier or currency code.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Tenant-wide customers:manage permission is required.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Active customer not found in the tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/customers/{customer_id}/credit-terms/{currency_code}:
    put:
      operationId: setTenantCustomerCreditTerm
      summary: Create or revise a customer's currency-specific credit terms
      description: Requires tenant-wide customers:manage. Use expectedRevision 0 for first creation; later changes must match the current revision. Every update records a reason and immutable history event.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: customer_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: currency_code, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z]{3}$' } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetHostedCustomerCreditTermRequest' } } }
      responses:
        '200':
          description: Created or updated credit term, or the original result from an exact retry.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCustomerCreditTermEnvelope' } } }
        '400':
          description: Invalid term amount, due days, reason, revision or request key.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Tenant-wide customers:manage permission is required.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Active customer not found in the tenant.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Stale revision or idempotency key conflict.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/station-capacity:
    get:
      operationId: getTenantStationCapacity
      summary: Read licensed station usage for the business owner
      description: >-
        Requires the tenant-scoped license:manage permission. Returns the
        currently effective station entitlement and the number of active,
        device-linked register stations. Staff accounts are not counted as
        licensed stations. An absent or ineffective entitlement returns a null
        limit and zero available slots. This endpoint reports capacity; it does
        not purchase or change a subscription.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current station entitlement and activation usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationCapacityEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The identity does not have tenant-scoped license management permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The tenant is not available to this identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The identity or tenant database is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/overview:
    get:
      operationId: getTenantOverview
      summary: Read paged sales and stock summaries across authorized branches
      description: >-
        Requires an active membership and branch-scoped sales:read or
        products:read permission for at least one branch. Each result includes
        only the metrics authorized for that branch. Branch sales use a rolling
        168-hour window and remain grouped by currency. Branch stock alerts count
        active products at or below their reorder point and include at most six
        lowest-stock products. A manager scoped to selected branches sees only
        those branches; a tenant-wide owner sees all branches. This read endpoint
        does not change inventory, sales, or entitlements.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: tenant_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Paged branch metrics limited to this identity's effective read permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantOverviewEnvelope'
        '400':
          description: Overview pagination values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: No branch overview read permission is assigned to this identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The tenant is not available to this identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: The identity or tenant database is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/permissions:
    get:
      operationId: getStationPermissions
      summary: Get effective baseline permissions for an assigned station
      description: >-
        Requires a verified active identity and a station-scoped or broader
        membership grant with pos:use. Tenant, branch and station IDs are
        checked against the identity's RLS-filtered memberships. Permissions are
        computed by the API from canonical built-in roles; custom role grants
        fail closed until persisted role permissions are implemented. This
        snapshot supports client navigation and is not a substitute for checking
        authorization inside each business workflow operation.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective server-owned permissions for the assigned station.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationPermissionsEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The identity is active but lacks permission to use this station.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The tenant, branch or station is not available to this identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity provider or tenant database is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/activation-challenge:
    post:
      operationId: createStationActivationChallenge
      summary: Create a short-lived owner challenge for device-key proof
      description: >-
        Requires a verified owner membership and an active station. The
        challenge is bound to the tenant, branch, station and owner membership,
        expires after five minutes, and can be consumed once by activation.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: One-time challenge and random nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationActivationChallengeEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The active account is not the business owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The station is not assigned to the active tenant membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity provider or tenant database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/activation:
    post:
      operationId: activateStation
      summary: Activate a physical station against tenant capacity
      description: >-
        Requires a verified owner membership for the tenant and an enabled
        stations.active entitlement. The server serializes activation per tenant,
        binds one 32-byte device public key to a station, and returns the active
        station count and capacity. Staff accounts do not consume station slots.
        The device proves private-key possession by signing the canonical
        challenge message; each challenge is consumed once in the activation
        transaction. Device replacement and checkout lease enforcement remain
        separate operations.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationActivationRequest'
      responses:
        '200':
          description: Activation created or an identical activation request safely replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationActivationEnvelope'
        '400':
          description: The device public key or signature is malformed or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '402':
          description: The tenant has no active stations.active entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The active account is not the business owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The station is not assigned to the active tenant membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Capacity is full, or the station/device is already bound elsewhere.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity provider or tenant database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/activation-revocation:
    post:
      operationId: revokeStationActivation
      summary: Revoke a station device binding and free its licensed slot
      description: >-
        Requires the tenant owner. The reason and acting membership are retained
        with the revoked activation. Any active cashier lease is ended and its
        station lock is removed in the same transaction. The station can then be
        activated again with a fresh signed device challenge.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationActivationRevocationRequest'
      responses:
        '200':
          description: The active activation was revoked and its slot released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationActivationRevocationEnvelope'
        '400':
          description: Revocation reason is shorter than 3 or longer than 500 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: The identity token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The active account is not the tenant owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The station is not assigned to the active tenant membership.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: There is no active activation to revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity provider or tenant database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/actor-lease-challenge:
    post:
      operationId: createStationActorLeaseChallenge
      summary: Create a one-time device proof challenge for cashier lease acquisition
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Short-lived challenge bound to the current cashier and station.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLeaseChallengeEnvelope'
        '403':
          description: An assigned cashier profile is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/actor-lease:
    post:
      operationId: acquireStationActorLease
      summary: Acquire the active cashier lease for a hosted station
      description: >-
        Requires an assigned active cashier membership and an Ed25519 proof
        signed by the station key over the one-time lease challenge, actor and
        active activation. Grants at most one unexpired cashier actor lease per
        station. The 45-second lease token is returned once and stored only as
        a SHA-256 hash. Management users must switch to an assigned cashier
        profile before acquiring a lease. Lease challenges return the exact
        UTF-8 proof message so clients do not disclose their internal identity ID.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationLeaseAcquireRequest'
      responses:
        '200':
          description: Lease acquired. The bearer token is returned only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLeaseEnvelope'
        '401':
          description: The identity token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: An assigned cashier profile is required or the station key proof is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The station is not assigned, active, or activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Another actor holds the station lease or the one-time proof challenge is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/checkout-challenge:
    post:
      operationId: createHostedCheckoutProofChallenge
      summary: Prepare a device-signature challenge for a hosted checkout attempt
      description: >-
        Requires a cashier-scoped sales:checkout grant, the current station lease
        ID and token, and an Idempotency-Key. The client supplies SHA-256 of the
        exact serialized checkout body. The server returns a 60-second nonce and
        canonical message for the active station key to sign. This endpoint does
        not create a sale; the checkout endpoint must recompute the body hash and
        verify and consume the challenge atomically with all financial writes.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
