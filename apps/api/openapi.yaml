            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Identity is not provisioned or lacks support access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
