          application/json:
            schema: { $ref: '#/components/schemas/AttachBranchProductRequest' }
      responses:
        '201': { description: Shared product added with branch-specific settings, content: { application/json: { schema: { $ref: '#/components/schemas/BranchProductEnvelope' } } } }
        '400': { description: Branch price, tax or stock values are invalid, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Missing branch-scoped products write permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Product is not active in this tenant, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: Product is already assigned to this branch, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/sales:
    get:
      operationId: getBranchSalesReport
      summary: Read branch sales totals and paged receipt summaries
      description: Requires sales:read. Dates are UTC calendar dates; toDate is exclusive. Results are limited to 100 rows per page.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, description: Exclusive end date, schema: { type: string, format: date } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 50000, default: 0 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Branch sales aggregate and receipt page, content: { application/json: { schema: { $ref: '#/components/schemas/BranchSalesReportEnvelope' } } } }
        '400': { description: Invalid date range or pagination, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Missing sales read permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/accounting/coverage:
    get:
      operationId: getBranchAccountingCoverage
      summary: Read branch accounting posting coverage and exceptions
      description: Requires reports:read. Dates use branch-local calendar dates with an exclusive toDate. Exception details are capped at 50 rows.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, description: Exclusive branch-local end date, schema: { type: string, format: date } }
      responses:
        '200': { description: Posting counts and bounded journal exceptions, content: { application/json: { schema: { $ref: '#/components/schemas/BranchAccountingCoverageEnvelope' } } } }
        '400': { description: Invalid date range, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Missing reports read permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Branch is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Accounting coverage is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/accounting/trial-balance:
    get:
      operationId: getBranchTrialBalance
      summary: Read a journal-derived branch trial balance
      description: Requires reports:read. Dates use branch-local calendar dates with an exclusive toDate. Balances remain separated by currency and include posting coverage for sales and refunds; they do not include opening balances or external settlement reconciliation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, description: Exclusive branch-local end date, schema: { type: string, format: date } }
      responses:
        '200': { description: Journal totals grouped by account and currency with coverage, content: { application/json: { schema: { $ref: '#/components/schemas/BranchTrialBalanceEnvelope' } } } }
        '400': { description: Invalid date range, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Missing reports read permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Branch is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Trial balance is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/accounting/income-statement:
    get:
      operationId: getBranchIncomeStatement
      summary: Read a journal-derived operating income statement
      description: Requires reports:read. Dates use branch-local calendar dates with an exclusive toDate. Amounts remain separated by currency. The report uses posted journals only and excludes opening balances, financing or income-tax adjustments, unposted sources and external settlement reconciliation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fromDate, in: query, schema: { type: string, format: date } }
        - { name: toDate, in: query, description: Exclusive branch-local end date, schema: { type: string, format: date } }
      responses:
        '200': { description: Currency-separated operating statement with source posting coverage, content: { application/json: { schema: { $ref: '#/components/schemas/BranchIncomeStatementEnvelope' } } } }
        '400': { description: Invalid date range, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Missing reports read permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Branch is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Income statement is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/accounting/balance-sheet:
    get:
      operationId: getBranchBalanceSheet
      summary: Read a provisional journal-derived branch balance sheet
      description: Requires reports:read. asOfDate is inclusive in the branch timezone. Results are separated by currency; retained earnings are derived from posted temporary accounts. The report remains provisional until opening balances and all journal sources are complete.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: asOfDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Provisional currency-separated assets, liabilities and equity totals, content: { application/json: { schema: { $ref: '#/components/schemas/BranchBalanceSheetEnvelope' } } } }
        '400': { description: Invalid as-of date, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Missing reports read permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Branch is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Balance sheet is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/accounting/cash-flow:
    get:
      operationId: getBranchCashFlowStatement
      summary: Read provisional physical-cash activity for a branch
      description: Requires reports:read. fromDate is inclusive and toDate exclusive in the branch timezone. Account 1000 is physical cash; card/mobile-money/bank-transfer/other clearing balances are shown separately and excluded from cash. Paired internal transfers and cash drops are eliminated. Manual paid-in/out movements remain unclassified. This is not a complete cash-flow statement until settlement, investing/financing and source coverage are implemented.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, description: Exclusive branch-local end date, schema: { type: string, format: date } }
      responses:
        '200': { description: Provisional posted cash activity, reconciliation bridge, clearing balances and coverage limitations, content: { application/json: { schema: { $ref: '#/components/schemas/BranchCashFlowEnvelope' } } } }
        '400': { description: Invalid date range, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Missing reports read permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Branch is unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Cash-flow activity is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/accounting/cash-reconciliation:
    get:
      operationId: getBranchCashReconciliation
      summary: Compare tracked branch cash with account 1000
      description: Requires reports:read. Reports the current signed physical-cash subledger total, posted cash-account balance, latest explicit cutover, open shifts, uninitialized locations, and unclassified manual drawer movements. Amounts are minor currency units.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current physical-cash to general-ledger comparison, content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashReconciliationStatusEnvelope' } } } }
        '403': { description: Requires reports:read, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Reconciliation status is temporarily unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    post:
      operationId: recordBranchCashReconciliation
      summary: Record explicit branch cash cutover and opening-equity adjustment
      description: Requires accounting:close (owner or admin). All active cash locations must have opening counts and all drawer shifts must be closed. A nonzero tracked-cash minus account-1000 balance is journaled between account 1000 and opening equity account 3000. The immutable record retains the measured totals, reason, actor and idempotency key. Unclassified paid-in/paid-out movements are not guessed into revenue or expenses.
      security: [{ bearerAuth: [] }]
      parameters:
