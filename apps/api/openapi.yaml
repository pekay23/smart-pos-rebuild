      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Unassigned active tenant products ordered by name, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogProductIdentitiesEnvelope' } } } }
        '403': { description: Missing branch-scoped products write permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/products/{product_id}/attach:
    post:
      operationId: attachCatalogProductToBranch
      summary: Add an existing tenant product to a branch
      description: Requires branch-scoped products:write permission. The product is selected by its exact tenant product ID. Branch price, tax, opening stock and stock alerts are independent; opening quantity and audit event commit atomically.
