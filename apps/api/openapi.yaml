  /v1/tenants/{tenant_id}/branches/{branch_id}/entities/{entity_type}/{entity_id}/image:
    get:
      operationId: getHostedEntityImage
      summary: Read an authorized product, customer, supplier, or staff image
      description: Requires the matching branch read permission. Staff images require owner/admin users:write permission. Image bytes are separate from record list payloads and are not publicly cacheable.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entity_type, in: path, required: true, schema: { type: string, enum: [product, customer, supplier, staff] } }
        - { name: entity_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Private image bytes with a verified image content type.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '401':
          description: Missing or invalid access token.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: The account cannot read this entity type in the branch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Entity or image does not exist.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    put:
      operationId: putHostedEntityImage
      summary: Upload or replace a product, customer, supplier, or staff image
      description: Requires the matching manager write permission. Staff images require owner/admin users:write permission. Accepts PNG, JPEG, or WebP up to 2 MiB, validates file signatures, and stores the upload with tenant RLS and an audit record.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entity_type, in: path, required: true, schema: { type: string, enum: [product, customer, supplier, staff] } }
        - { name: entity_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '204': { description: The image was stored. }
        '400':
          description: Unsupported image type, invalid signature, or image exceeds 2 MiB.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          description: Missing or invalid access token.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: The account cannot manage images for this entity type in the branch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      operationId: deleteHostedEntityImage
      summary: Delete an authorized entity image
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: entity_type, in: path, required: true, schema: { type: string, enum: [product, customer, supplier, staff] } }
        - { name: entity_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: The image was removed or was already absent. }
        '401':
          description: Missing or invalid access token.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: The account cannot manage images for this entity type in the branch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
