        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Derived signed physical cash-location balances.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashLocationsEnvelope' } } }
        '403':
          description: Requires cash:locations:read.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      operationId: createBranchCashLocation
      summary: Create a safe, petty-cash, or other physical cash location
      description: Creates branch-scoped location identity. Register locations are provisioned only by a future station-integrated workflow.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashLocationCreateRequest' } } }
      responses:
        '200':
          description: Location created or exact idempotent retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashLocationMutationEnvelope' } } }
        '400':
          description: Invalid location name or type.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires cash:locations:write.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Duplicate location name or idempotency key reused with a different request.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/cash-locations/{location_id}/opening:
    post:
      operationId: recordBranchCashLocationOpening
      summary: Record the one-time physical opening count for a location
      description: Starts tracked physical cash history without posting a duplicate general-ledger opening journal. A register location must be counted while its drawer is closed.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: location_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashOpeningRequest' } } }
      responses:
        '200':
          description: Opening count recorded or exact retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashLocationMutationEnvelope' } } }
        '403':
          description: Requires cash:locations:write.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Location already has an opening count or other cash events.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/cash-locations/{location_id}/events:
    get:
      operationId: listBranchCashLocationEvents
      summary: List immutable cash-location opening and transfer events
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: location_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Up to 500 recent immutable events.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashLocationEventsEnvelope' } } }
        '403':
          description: Requires cash:locations:read.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/cash-transfers:
    post:
      operationId: transferBranchCash
      summary: Transfer tracked cash between initialized non-register locations
      description: Locks both location rows in stable order and appends matching transfer legs atomically. Register drawers are excluded because their movements must be tied to a station lease and drawer close.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashTransferRequest' } } }
      responses:
        '200':
          description: Transfer recorded or exact idempotent retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashTransferEnvelope' } } }
        '400':
          description: Invalid transfer or register location selected.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires cash:locations:write.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Insufficient tracked funds or transfer conflict.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/expenses:
    get:
      operationId: listBranchExpenses
      summary: List expenses recorded for an authorized branch
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Branch currency and a bounded page of expense source records.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseWorkspaceEnvelope' } } }
        '403':
          description: Requires branch-scoped expenses:read.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      operationId: createBranchExpense
      summary: Record a branch expense
      description: Appends a non-cash expense or a safe/petty-cash expense, its balanced journal and audit event atomically. Register cash must use the signed station route so the till outflow is linked atomically. Cash-location expenses require an active initialized safe or petty-cash location and create a source-linked outflow in the same transaction.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseRequest' } } }
      responses:
        '201':
          description: Expense recorded or exact idempotent retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseResultEnvelope' } } }
        '400':
          description: Invalid expense fields; cash is not accepted on this branch route.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires branch-scoped expenses:write.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Idempotency key was reused with different expense details.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/expenses/{expense_id}/reimbursements:
    get:
      operationId: listBranchExpenseReimbursements
      summary: List expense returns and the remaining reimbursable amount
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expense_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Original expense total, returns to date and immutable return history.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseReimbursementWorkspaceEnvelope' } } }
        '403':
          description: Requires branch-scoped expenses:read.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: The expense is unavailable in this branch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      operationId: createBranchExpenseReimbursement
      summary: Record an expense return or reimbursement
      description: Records a partial or full return against an existing expense. Cash is received into an initialized branch safe or petty-cash location. A balanced reversal journal, source-linked inflow, immutable reimbursement and audit event commit atomically. Drawer deposits remain a separate signed station workflow.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expense_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseReimbursementRequest' } } }
      responses:
        '201':
          description: Expense return recorded or exact retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseReimbursementResultEnvelope' } } }
        '400':
          description: Invalid amount, method, date, reason or return destination.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires branch-scoped expenses:write.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Reimbursement exceeds the remaining expense amount or request conflicts.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/expenses/{expense_id}/cost-center:
    get:
      operationId: getBranchExpenseCostCenterHistory
      summary: Read the immutable cost-center correction history for an expense
      description: Expenses without a correction are reported as legacy_unassigned. Corrections affect the original expense and reimbursement dates without changing payment, cash or journal records.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expense_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current reporting allocation and ordered correction history.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseCostCenterHistoryEnvelope' } } }
        '403':
          description: Requires branch-scoped expenses:read.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: The expense is unavailable in this branch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/expenses/{expense_id}/cost-center/reclassifications:
    post:
      operationId: reclassifyBranchExpenseCostCenter
      summary: Append a revision-checked expense cost-center correction
      description: Requires expenses:reclassify. The correction and audit history are append-only; payment, cash movement and journal sources stay unchanged. An exact retry replays the saved correction.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: expense_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseCostCenterCorrectionRequest' } } }
      responses:
        '201':
          description: Correction appended or exact idempotent retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseCostCenterReclassificationEnvelope' } } }
        '400':
          description: Invalid revision, cost center, station, reason or idempotency key.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires branch-scoped expenses:reclassify.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: The expense or active station is unavailable in this branch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Idempotency key payload or expected revision conflicts with saved history.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/supplier-bills:
    post:
      operationId: matchBranchSupplierBill
      summary: Record a supplier invoice and allocate it to received delivery balances
      description: Records an immutable invoice match and balanced source journal (debit GRNI, credit accounts payable). It does not record payment or move cash.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierBillRequest' } } }
      responses:
        '201':
          description: Invoice matched, or exact retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierBillResultEnvelope' } } }
        '400':
          description: Invalid invoice dates, amount or allocation sum.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires branch-scoped purchases:invoice.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Duplicate supplier invoice reference, already allocated delivery balance or request-key mismatch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/supplier-credit-notes:
    post:
      operationId: createBranchSupplierCreditNote
      summary: Record a source-linked supplier credit for physical goods returned from received stock
      description: Creates an immutable credit note and lines, removes available stock, appends stock movements and audit events, and posts a balanced debit to accounts payable and credit to inventory. The credit is capped by received quantity, active stock commitments, the delivery allocation and unpaid bill balance. It does not issue a cash refund for a paid invoice.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierCreditNoteRequest' } } }
      responses:
        '201':
          description: Credit note recorded atomically.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierCreditNoteResultEnvelope' } } }
        '200':
          description: Exact retry returned without applying the stock or accounting effects again.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierCreditNoteResultEnvelope' } } }
        '400':
          description: Invalid credit reference, reason, date or returned quantities.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires branch-scoped suppliers:settle permission (owner/admin).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: The invoice, receipt or received product line is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Stock, active commitment, bill balance or receipt allocation changed, the supplier reference is duplicated, or the request key payload conflicts.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/supplier-payments:
    post:
      operationId: recordBranchSupplierPayment
      summary: Record an externally completed supplier payment and allocate it to open invoices
      description: Creates immutable payment/allocation records and a balanced source journal atomically. Non-cash transfers are tenant-reported and not provider-verified. Cash can be recorded from an initialized branch safe/petty-cash location with a linked outflow, or through the signed station endpoint for a till payment.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierPaymentRequest' } } }
      responses:
        '200':
          description: Payment recorded or exact retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierPaymentResultEnvelope' } } }
        '400':
          description: Invalid payment method, amount, reference or allocation sum, or a missing safe/drawer cash source.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Requires branch-scoped suppliers:settle (owner/admin baseline only).
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Supplier, invoice or selected cash location is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Invoice balance or cash-location balance changed, allocation exceeds payable amount, or idempotency key was reused with different details.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/supplier-payments:
    post:
      operationId: recordStationSupplierCashPayment
      summary: Record a cash supplier payment and link the signed drawer outflow
      description: Requires supplier settlement permission and the active cashier lease for this station. The payment, invoice allocations, source journal, audit event, one-use financial challenge, and source-linked drawer paid_out movement commit in one transaction. Exact retries do not create a second movement.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
        - { name: x-station-lease-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: x-station-lease-token, in: header, required: true, schema: { type: string } }
        - { name: x-station-challenge-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: x-station-proof, in: header, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{128}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierPaymentRequest' } } }
      responses:
        '200':
          description: Payment recorded or exact retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupplierPaymentResultEnvelope' } } }
        '400':
          description: Invalid cash payment or drawer shift.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Missing supplier settlement permission or invalid station proof.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Cashier lease, drawer shift, invoice balance or idempotency request conflicts with current state.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/expenses:
    post:
      operationId: recordStationCashExpense
      summary: Record a cashier cash expense and link the drawer outflow
      description: Requires expenses:cash:write, an active cashier lease, a signed one-use financial challenge and the open drawer shift. The immutable expense, balanced category-to-cash journal, audit record and one source-linked drawer paid_out commit atomically. Exact retries do not add another movement. Cashiers cannot list or manage branch expenses.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
        - { name: x-station-lease-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: x-station-lease-token, in: header, required: true, schema: { type: string } }
        - { name: x-station-challenge-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: x-station-proof, in: header, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{128}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashExpenseRequest' } } }
      responses:
        '200':
          description: Expense recorded or exact idempotent retry returned.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedExpenseResultEnvelope' } } }
        '400':
          description: Invalid expense details or drawer shift.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Missing cashier cash-expense permission or invalid station proof.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Cashier lease, open drawer or idempotency request conflicts with current state.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/customers:
    get:
      operationId: listBranchCustomers
      summary: Search and page customers visible in an authorized branch
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: query, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Search active customers by name, phone or email. Literal percent and underscore characters are escaped. }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 100000, default: 0 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: includeArchived, in: query, required: false, schema: { type: boolean, default: false }, description: Requires customers:manage; cashiers can only list active customers. }
      responses:
        '200':
          description: A bounded page of matching active customers, or active and archived customers when authorized.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedCustomersEnvelope' } } }
