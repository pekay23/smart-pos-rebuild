          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/held-tickets/{ticket_id}/discard:
    post:
      operationId: discardBranchHeldTicket
      summary: Discard a shared ticket that has no unresolved checkout
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: ticket_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Station-Lease-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Station-Lease-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HeldTicketRevisionRequest' } } }
      responses:
        '200':
          description: Ticket marked discarded.
          content: { application/json: { schema: { $ref: '#/components/schemas/HeldTicketEnvelope' } } }
        '409':
          description: Ticket is in checkout or the revision/claim changed.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/sales/{sale_id}/refunds:
    get:
      operationId: getStationSaleRefunds
      summary: Read refund history and remaining return quantities for a station sale
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sale_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Station-scoped sale refund detail.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedSaleRefundDetailEnvelope' } } }
        '403':
          description: Missing station POS permission.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Sale unavailable at this station.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    post:
      operationId: refundHostedSale
      summary: Record a partial return or eligible full-sale void
      description: >-
        Requires sales:refund, an active cashier lease and activation, a fresh
        body-bound station signature, and idempotency key. Cash is paid from
        the open station drawer and linked to its paid-out movement. When a register cash location is configured, the refund also appends one linked negative physical-cash event; the paid-out drawer movement remains the X/Z source. Non-cash
        payouts are manually recorded and require an external reference; this
        endpoint does not contact or verify a payment provider. Restock is
        explicit per returned line. A void is allowed only for the first full
        return of every sale line.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sale_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
        - { name: X-Station-Lease-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Station-Lease-Token, in: header, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: X-Station-Challenge-Id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Station-Proof, in: header, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{128}$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedSaleRefundRequest' } } }
      responses:
        '201':
          description: Refund recorded.
          content: { application/json: { schema: { $ref: '#/components/schemas/HostedSaleRefundEnvelope' } } }
        '400':
          description: Invalid refund details.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Missing sales:refund permission.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Invalid proof, non-refundable state, drawer requirement, insufficient cash, or idempotency conflict.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/sales/{sale_id}/customer:
    put:
      operationId: attachHostedSaleCustomer
      summary: Link a customer to a completed sale after checkout
      description: >-
        Requires customers:write and a sale visible to the current station.
        The append-only association preserves checkout-time sale data and does
        not modify totals, tenders, inventory or the original customer field.
        Exact retries are idempotent; changing an existing association conflicts.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: station_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sale_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachHostedSaleCustomerRequest' }
      responses:
        '200':
          description: Customer attached, or the same existing association replayed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachedHostedSaleCustomerEnvelope' }
        '400':
          description: Invalid request or identifiers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: The account lacks customer write permission at this station.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Sale or active customer is unavailable in this scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Sale already has a different customer or cannot be changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '503':
          description: Customer association persistence is temporarily unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/stations/{station_id}/sales/{sale_id}/receipt:
    get:
      operationId: getStationHostedReceipt
      summary: Read a receipt at a station the account may use
      description: The cashier is restricted by forced RLS to their own station sales; this route is suitable for station receipt recovery and reprinting.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: station_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sale_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Immutable recorded receipt snapshots, content: { application/json: { schema: { $ref: '#/components/schemas/HostedReceiptEnvelope' } } } }
        '403': { description: Account lacks station POS view permission, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Receipt is outside the active station's visible scope, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/station-actor-leases/{lease_id}/heartbeat:
    post:
      operationId: heartbeatStationActorLease
