            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/station-actor-leases/{lease_id}/release:
    post:
      operationId: releaseStationActorLease
      summary: Release the current cashier station lease
      security:
        - bearerAuth: []
      parameters:
        - name: lease_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationLeaseCommand'
      responses:
        '200':
          description: The lease was released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLeaseEnvelope'
        '409':
          description: The lease token is invalid, expired, released, or belongs to another actor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/products:
    get:
      operationId: listBranchProducts
      summary: List branch catalog and stock for authorized staff
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Products associated with the branch, including inactive items for inventory review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchProductsEnvelope'
        '403':
          description: The caller lacks branch-scoped products:read permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createBranchProduct
      summary: Add a tenant catalog product and its branch price and opening stock
      description: >-
        Requires branch-scoped products:write permission. Product identity and
        branch price, tax and opening stock are written atomically with an
        opening stock movement and audit event. Prices are minor units and tax
        is basis points. A blank SKU is generated by the server.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchProductRequest'
      responses:
        '201':
          description: Product and branch catalog entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchProductEnvelope'
        '400':
          description: Product text, money, tax or stock values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The caller lacks branch-scoped products:write permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: SKU or barcode already exists in this tenant's catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /v1/tenants/{tenant_id}/branches/{branch_id}/product-candidates:
    get:
      operationId: listBranchProductCandidates
      summary: List active business products not yet assigned to a branch
      description: Requires branch-scoped products:write permission. Candidates retain their tenant-wide product identity; this endpoint never matches by name.
