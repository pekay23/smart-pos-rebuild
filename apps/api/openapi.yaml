        - { name: option_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePaymentOption' }
      responses:
        '200':
          description: Payment method updated and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOptionEnvelope' }
        '400':
          description: Invalid method data or revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: The caller lacks branch-scoped payments:write permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The revision is stale or the option is not available.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/payment-integration-requests:
    get:
      operationId: listPaymentIntegrationRequests
      summary: List payment integration requests for a branch
      description: Requires branch-scoped payments:write permission. Shows requests for this branch and only their customer-visible progress. Operator-only notes and queue controls are not exposed.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Recent requests for this branch.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntegrationRequestsEnvelope' }
        '403':
          description: The caller lacks branch-scoped payments:write permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    post:
      operationId: createPaymentIntegrationRequest
      summary: Record a request for an unsupported bank or payment provider
      description: Requires branch-scoped payments:write permission. Requests are audited and idempotent. Do not submit credentials, PINs, card or account data. This records the request for operator triage; it does not notify a developer or connect a provider.
      security:
        - bearerAuth: []
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPaymentIntegrationRequest' }
      responses:
        '201':
          description: Request recorded and audited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntegrationRequestEnvelope' }
        '400':
          description: Invalid request, unsafe details or missing idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: The caller lacks branch-scoped payments:write permission.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: The idempotency key was reused with a different payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /v1/tenants/{tenant_id}/branches/{branch_id}/support-requests:
    get:
      operationId: listHostedSupportRequests
      summary: List branch support requests
      description: Requires branch-scoped support:write. Returns this branch's public progress only; operator notes and issue links are private.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Recent requests, content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupportRequestsEnvelope' } } } }
        '403': { description: The caller lacks branch-scoped support:write., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
    post:
      operationId: createHostedSupportRequest
      summary: Submit a general support request
      description: Requires branch-scoped support:write. Requests are audited and idempotent. Do not include passwords, API keys, card or account data.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/NewHostedSupportRequest' } } }
      responses:
        '201': { description: Request recorded., content: { application/json: { schema: { $ref: '#/components/schemas/HostedSupportRequestEnvelope' } } } }
        '400': { description: Invalid request or unsafe details., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: Idempotency key reused with a different payload., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /operator/v1/me:
