    StationActivationRequest:
      type: object
      additionalProperties: false
      required: [devicePublicKey, challengeId, signature]
      properties:
        devicePublicKey:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 32-byte station public key encoded as hexadecimal.
        challengeId:
          type: string
          format: uuid
        signature:
          type: string
          pattern: '^[0-9a-fA-F]{128}$'
          description: >-
            Ed25519 signature over UTF-8 bytes of these seven newline-separated
            fields, with no trailing newline: advanced-pos/station-activation/v1,
            tenant_id, branch_id, station_id, challengeId, lowercase nonce hex,
            lowercase devicePublicKey hex. UUID fields use their lowercase
            canonical form.
