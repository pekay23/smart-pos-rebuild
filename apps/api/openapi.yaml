      description: Revision-checked and idempotent. Private notes are stored only in operator history; issue stages and links are never exposed to tenants.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OperatorHostedSupportRequestUpdate' } } }
      responses:
        '200': { description: Updated request's public projection., content: { application/json: { schema: { $ref: '#/components/schemas/OperatorHostedSupportRequest' } } } }
        '409': { description: Stale revision, invalid transition or idempotency conflict., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /operator/v1/support-requests/{request_id}/events:
    get:
      operationId: listOperatorHostedSupportRequestEvents
      summary: Read private operator history for a tenant request
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: A bounded page of audited operator events., content: { application/json: { schema: { $ref: '#/components/schemas/OperatorHostedSupportRequestEventPage' } } } }
  /operator/v1/issues:
    get:
      operationId: listOperatorSupportIssues
      summary: List the internal support issue Kanban
      description: Requires an active provisioned support operator. Issue stages, assignments, linked tenant requests and counts are operator-only; each read is audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OperatorSupportIssueStatus' } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/OperatorSupportIssueCategory' } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: A bounded page of issues with counts of linked reports.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorSupportIssuePage' }
        '401':
          description: Invalid or missing operator identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Identity is not provisioned or lacks support access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    post:
      operationId: createOperatorSupportIssue
      summary: Create an internal support issue
      description: Creates an issue and optionally links one payment integration request as its primary source. Idempotent and audited; tenant progress remains separate.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorSupportIssueCreate' }
      responses:
        '200':
          description: The created or idempotently replayed issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorSupportIssue' }
        '400':
          description: Invalid issue, source request or idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Invalid or missing operator identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Idempotency conflict or source request already linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /operator/v1/issues/{issue_id}:
    patch:
      operationId: updateOperatorSupportIssue
      summary: Update issue workflow, ownership and schedule
      description: Revision-checked and idempotent. Assignment can be changed to an active operator from the restricted directory or cleared; legacy claim/unassign actions remain supported. Private notes and due dates remain operator-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: issue_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorSupportIssueUpdate' }
      responses:
        '200':
          description: The updated issue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorSupportIssue' }
        '400':
          description: Invalid or empty issue update.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Invalid or missing operator identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Stale revision, invalid stage transition, assignment conflict or idempotency conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /operator/v1/issues/{issue_id}/events:
    get:
      operationId: listOperatorSupportIssueEvents
      summary: Read the private issue event history
      description: Returns append-only operator-only stage, assignment, schedule, link and private-note events. Every read is audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: issue_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: A bounded page of private issue events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorSupportIssueEventPage' }
        '401':
          description: Invalid or missing operator identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '403':
          description: Identity is not provisioned or lacks support access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404':
          description: Issue does not exist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /operator/v1/issues/{issue_id}/payment-requests/{request_id}:
    post:
      operationId: linkPaymentRequestToSupportIssue
      summary: Link a duplicate or related payment request
      description: Links one tenant request to one internal issue, increments the issue revision and appends a private event atomically. No other tenant receives this link or issue data.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: issue_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorSupportIssueLink' }
      responses:
        '200':
          description: The issue with its updated linked-report count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorSupportIssue' }
        '400':
          description: Invalid relationship, revision or idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '401':
          description: Invalid or missing operator identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: Stale issue revision, duplicate link or idempotency conflict.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /operator/v1/issues/{issue_id}/support-requests/{request_id}:
    post:
      operationId: linkHostedSupportRequestToIssue
      summary: Link a general support request to an internal issue
      description: Adds a private typed source link and issue event. The tenant keeps its independent public status and message.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: issue_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: request_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OperatorSupportIssueLink' } } }
      responses:
        '200': { description: The issue with updated source count., content: { application/json: { schema: { $ref: '#/components/schemas/OperatorSupportIssue' } } } }
        '409': { description: Stale issue revision, duplicate link or idempotency conflict., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/attendance/me:
    get:
      operationId: getMyHostedAttendance
      summary: Read the authenticated employee's attendance status and branch schedule
      description: >-
        Requires attendance:self at the branch. Work periods belong to the stable
        tenant membership, independent of temporary cashier profile switching.
        This read never starts or ends a work period.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The employee schedule and any open work period at this branch.
          content: { application/json: { schema: { $ref: '#/components/schemas/MyAttendanceEnvelope' } } }
        '401': { description: Missing or invalid bearer token., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Attendance self-service permission is missing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Identity or database service is unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/attendance/me/clock-in:
    post:
      operationId: clockInHostedAttendance
      summary: Explicitly clock in the authenticated staff member
      description: >-
        Requires attendance:self and an Idempotency-Key. The server assigns the
        clock timestamp. An enabled schedule determines the due time only when
        clock-in occurs within its scheduled window; otherwise a bounded 16-hour
        safety period is used. No schedule automatically starts work.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      responses:
        '200': { description: Clock-in accepted or replayed., content: { application/json: { schema: { $ref: '#/components/schemas/WorkPeriodEnvelope' } } } }
        '400': { description: Invalid idempotency key., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: Missing or invalid bearer token., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Attendance self-service permission is missing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: Another period is open or the key was used for another action., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Identity or database service is unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/attendance/me/clock-out:
    post:
      operationId: clockOutHostedAttendance
      summary: Explicitly clock out the authenticated staff member
      description: Requires attendance:self and an Idempotency-Key. The server assigns the clock-out timestamp.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$' } }
      responses:
        '200': { description: Clock-out accepted or replayed., content: { application/json: { schema: { $ref: '#/components/schemas/WorkPeriodEnvelope' } } } }
        '401': { description: Missing or invalid bearer token., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Attendance self-service permission is missing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: No open work period exists at this branch., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: The idempotency key was used for another attendance action., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Identity or database service is unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/attendance/staff:
    get:
      operationId: listAttendanceStaff
      summary: List active staff assigned to a branch for schedule management
      description: Requires attendance:manage. Returns display names and role labels only, with no provider subjects or contact details.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Branch-scoped active staff list., content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceStaffEnvelope' } } } }
        '401': { description: Missing or invalid bearer token., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Attendance management permission is missing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '503': { description: Identity or database service is unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/attendance/schedules:
    get:
      operationId: listAttendanceSchedules
      summary: List branch staff schedules
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Revisioned schedules using branch-local time., content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceSchedulesEnvelope' } } } }
        '403': { description: Attendance management permission is missing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/attendance/schedules/{membership_id}:
    put:
      operationId: saveAttendanceSchedule
      summary: Create or revision-check a staff member's branch schedule
      description: Requires attendance:manage. expectedRevision is 0 to create a schedule; otherwise it must match the current revision. Later edits do not change existing periods.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: membership_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceScheduleUpdate' } } }
      responses:
        '200': { description: Saved schedule., content: { application/json: { schema: { $ref: '#/components/schemas/AttendanceScheduleEnvelope' } } } }
        '400': { description: Invalid weekdays or shift times., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Attendance management permission is missing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: Staff member or branch is unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: Schedule revision is stale., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/attendance/periods:
    get:
      operationId: listAttendancePeriods
      summary: Read recent branch attendance periods
      description: Requires attendance:read. Results are newest first and bounded to 100 rows.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200': { description: Recent work periods., content: { application/json: { schema: { $ref: '#/components/schemas/WorkPeriodsEnvelope' } } } }
        '400': { description: Invalid row limit., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '403': { description: Attendance read permission is missing., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/profile:
    get:
      operationId: getBranchProfile
      summary: Read branch contact information and weekly opening hours
      description: >-
        Requires products:read at this branch. Times are local to the branch
        timezone and an empty day denotes closure.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Branch profile and its optimistic-concurrency revision.
          content: { application/json: { schema: { $ref: '#/components/schemas/BranchProfileEnvelope' } } }
        '401':
          description: Missing or invalid bearer token.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Branch read permission is missing.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Branch is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503':
          description: Identity or database service is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    put:
      operationId: updateBranchProfile
      summary: Update branch contact information and weekly opening hours
      description: >-
        Requires branches:manage at this branch. Hours contain seven weekday
        arrays, up to four ordered, non-overlapping same-day intervals per day.
        Updates are revision checked and audited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tenant_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: branch_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BranchProfileUpdate' } } }
      responses:
        '200':
          description: Updated branch profile.
          content: { application/json: { schema: { $ref: '#/components/schemas/BranchProfileEnvelope' } } }
        '400':
          description: Contact fields or hours are invalid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401':
          description: Missing or invalid bearer token.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Branch settings permission is missing.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Branch is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: The branch profile revision is stale.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503':
          description: Identity or database service is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /v1/tenants/{tenant_id}/branches/{branch_id}/permissions:
    get:
      operationId: getBranchPermissions
      summary: Get effective management permissions for an assigned branch
      description: >-
        Requires a verified active identity, an RLS-filtered branch assignment,
        and at least one server-owned permission at branch scope. Station-only
        cashier grants do not qualify for branch management access. The response
        is a client access snapshot, not authorization for future workflow
        operations; each operation must check its own permission and resource.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: branch_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Effective built-in role permissions for this branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPermissionsEnvelope'
        '401':
          description: Missing, inactive, expired, or unauthorized bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: The identity has no management permissions for this branch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The tenant or branch is not available to this identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Identity provider or tenant database is not configured or temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HeldTicketCreateRequest:
      type: object
      additionalProperties: false
      required: [payload]
      properties:
        payload: { $ref: '#/components/schemas/HeldTicketPayload' }
    HeldTicketSaveRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, payload]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        payload: { $ref: '#/components/schemas/HeldTicketPayload' }
    HeldTicketRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
    HeldTicketCheckoutRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, body, idempotencyKey]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 1 }
        body: { type: object, additionalProperties: true }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    HeldTicketPayload:
      type: object
      description: Branch-scoped JSON draft; capped at 256 KiB by the API.
      additionalProperties: true
    HeldTicketEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/HeldTicket' }
    HeldTicketsEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/HeldTicket' }
    HeldTicket:
      type: object
      additionalProperties: false
      required: [id, revision, status, payload, checkoutBody, checkoutKey, claimLeaseId, completedSaleId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [held, checkout_pending, completed, discarded] }
        payload: { $ref: '#/components/schemas/HeldTicketPayload' }
        checkoutBody: { type: [object, 'null'], additionalProperties: true }
        checkoutKey: { type: [string, 'null'], maxLength: 128 }
        claimLeaseId: { type: [string, 'null'], format: uuid }
        completedSaleId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkPeriodEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/WorkPeriod' }
    WorkPeriodsEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WorkPeriod' } }
    WorkPeriod:
      type: object
      additionalProperties: false
      required: [id, branchId, membershipId, scheduleRevision, timezone, scheduledStartAt, dueAt, startedAt, endedAt, endReason, revision]
      properties:
        id: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        scheduleRevision: { type: [integer, 'null'], minimum: 1 }
        timezone: { type: string, minLength: 1 }
        scheduledStartAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        endReason: { type: [string, 'null'], enum: [staff, schedule, null] }
        revision: { type: integer, format: int64, minimum: 1 }
    MyAttendanceEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [serverNow, schedule, currentPeriod]
          properties:
