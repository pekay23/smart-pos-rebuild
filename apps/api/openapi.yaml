          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '403':
          description: Missing checkout permission or invalid station proof.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '404':
          description: Customer, branch or invoice is unavailable.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '409':
          description: Retry conflict, invoice allocation conflict, inactive lease or closed drawer.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '503':
          description: Collection could not be committed atomically.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
