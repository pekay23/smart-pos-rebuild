        - { name: X-Station-Proof, in: header, required: true, schema: { type: string, minLength: 128, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostedCashCollectionRequest' } } }
      responses:
