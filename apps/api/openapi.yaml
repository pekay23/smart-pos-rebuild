        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationLeaseCommand'
      responses:
        '200':
          description: The lease expiration was renewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationLeaseEnvelope'
        '409':
