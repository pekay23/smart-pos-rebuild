[package]
name = "pos-api"
default-run = "pos-api"
version = "0.1.0"
description = "Versioned HTTP API foundation for Advanced POS"
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ed25519-dalek = "2.2"
futures-util = "0.3"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
pos-core = { path = "../../crates/pos-core" }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rand = "0.8"
rsa = "0.9"
tower = { version = "0.5", features = ["util"] }
