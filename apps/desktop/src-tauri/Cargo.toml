[package]
name = "smart-pos-desktop"
version = "0.1.0"
description = "Offline-first Advanced POS retail point-of-sale application by Powered Solutions"
authors = ["Powered Solutions"]
edition.workspace = true
license.workspace = true

[lib]
name = "smart_pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "backup", "serialize"] }
pos-core = { path = "../../../crates/pos-core" }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2"
webauthn-rs = "0.5.5"
chrono-tz = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.23.1"
velopack = { version = "=1.3.39-g8d2844f", features = ["public-utils"] }

[target.'cfg(windows)'.dependencies]
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["win10"] }
openssl = { version = "0.10", features = ["vendored"] }
zeroize = "1"

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
